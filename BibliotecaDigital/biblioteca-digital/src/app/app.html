<div class="contenedor">

  <header>
    <h1>Biblioteca Digital</h1>
    <p>Consulta y registra libros</p>
  </header>


  <!-- SECCIÓN 1: LISTADO -->

  <section class="seccion">

    <h2>Listado de libros</h2>

    <button (click)="cargarLibros()">
      Actualizar libros
    </button>

    <div class="libros">

      <div class="tarjeta" *ngFor="let libro of libros">

        <h3>{{ libro.titulo }}</h3>

        <p>
          <strong>Autor:</strong>
          {{ libro.autor }}
        </p>

        <p>
          <strong>Año:</strong>
          {{ libro.anio }}
        </p>

        <p>
          <strong>Género:</strong>
          {{ libro.genero }}
        </p>

      </div>

    </div>

  </section>


  <!-- SECCIÓN 2: REGISTRO -->

  <section class="seccion">

    <h2>Registrar libro</h2>

    <form (ngSubmit)="registrarLibro()">

      <label>Título</label>

      <input
        type="text"
        name="titulo"
        [(ngModel)]="nuevoLibro.titulo"
        required
      >


      <label>Autor</label>

      <input
        type="text"
        name="autor"
        [(ngModel)]="nuevoLibro.autor"
        required
      >


      <label>Año</label>

      <input
        type="number"
        name="anio"
        [(ngModel)]="nuevoLibro.anio"
        required
      >


      <label>Género</label>

      <input
        type="text"
        name="genero"
        [(ngModel)]="nuevoLibro.genero"
        required
      >


      <button type="submit">
        Registrar libro
      </button>

    </form>

    <p class="mensaje" *ngIf="mensaje">
      {{ mensaje }}
    </p>

  </section>

</div>
